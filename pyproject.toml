[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-api-guard"
version = "0.1.0"
description = "Detect and auto-fix Claude/Anthropic API breaking changes in Python code."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
claude-api-guard-scan = "ast_scan:main"
claude-api-guard-autofix = "autofix:main"

# Flat top-level modules, not a claude_api_guard/ subpackage — deliberate,
# not an oversight. rules.py, ast_scan.py, and autofix.py already import
# each other with bare names (`from rules import RULES`, `from ast_scan
# import ...`), and action.yml + self-check.yml + sync_rules.py all run
# them as plain top-level scripts by path (github.action_path,
# sys.path.insert). Packaging them as-is means zero import-statement
# changes and zero risk to any of that already-working, already-tested
# machinery. The real cost: "rules", "ast_scan", "autofix" are generic
# top-level module names that could collide with something else on
# whatever environment installs this. Acceptable for now because the only
# realistic install path is a fresh, ephemeral CI job installing straight
# from this private git repo (see README's "Packaging" section) — not a
# shared environment — but a real `claude_api_guard/` package layout
# would be the right fix before this goes any wider than that.
[tool.setuptools]
py-modules = ["rules", "ast_scan", "autofix"]
