# TEMPLATE — how a downstream project (e.g. OddsScanner) uses
# claude-api-guard now that it's published at
# github.com/MarkMoneyMan/Claude-api-goat.
#
# Copy this into that project's own .github/workflows/.
#
# Caveat, stated plainly: Claude-api-goat is currently a PRIVATE repo.
# GitHub only lets a private repo's Action be referenced (`uses:`) from
# another repo when both repos are in the same account/org, or when the
# calling repo has explicitly been granted access under Settings →
# Actions → General → "Access" on Claude-api-goat. A public downstream
# repo, or one under a different account, can't use `uses:` against a
# private repo at all — for that, Claude-api-goat itself would need to be
# made public. OddsScanner is under the same account, so this works as-is
# there without any extra step.
#
# What it does: on every PR, flags Claude API usage that's broken or about
# to break. Fails the check only on HIGH severity by default so a MEDIUM/LOW
# heads-up doesn't block merging.

name: claude-api-guard check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MarkMoneyMan/Claude-api-goat@master
        with:
          path: .
          fail-on: HIGH
          # scan-js: "true"   # uncomment if this repo also has JS/TS Anthropic SDK usage
