# TEMPLATE — periodic auto-fix PR for a downstream project.
#
# Different caveat than check-on-pr.yml's, and worth separating clearly:
# `uses: owner/repo@ref` (an action reference) and `actions/checkout` with
# `repository:` (cloning a second repo's contents) are governed by two
# different GitHub mechanisms. The action-reference case in check-on-pr.yml
# is covered by Claude-api-goat's repo Settings → Actions → Access, and
# needs nothing extra for a same-account repo like OddsScanner. This
# workflow's second checkout step below is the other case: the default
# GITHUB_TOKEN a workflow gets is scoped ONLY to the repo it's running in
# — it can't read a second private repo, same-account or not, without
# being handed different credentials. So this step needs a `token:` input
# pointing at a PAT (fine-grained, "Contents: Read" on Claude-api-goat is
# enough) stored as a secret in the *downstream* repo, e.g.
# `CLAUDE_API_GOAT_RO_TOKEN` — set that up in OddsScanner's own repo
# Settings → Secrets before this workflow will actually run.
#
# What it does: once a week (and on-demand via workflow_dispatch), applies
# the 5 mechanical auto-fixes from autofix.py and opens a PR if anything
# changed. Uses peter-evans/create-pull-request, a well-established action
# for exactly this "generate a patch, open a PR from it" shape — no custom
# PR-opening code needed, and it already no-ops cleanly when there's
# nothing to fix.
#
# Known gap, stated plainly: autofix.py isn't published as an installable
# package yet (no PyPI release), so this checks out the tool's own repo
# into a subfolder alongside the consumer repo, rather than `pip install`-
# ing it. Works, but a real package would be cleaner — see README.md.

name: claude-api-guard autofix

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/checkout@v4
        with:
          repository: MarkMoneyMan/Claude-api-goat
          ref: master
          path: claude-api-guard-tool
          token: ${{ secrets.CLAUDE_API_GOAT_RO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply mechanical auto-fixes
        run: python3 claude-api-guard-tool/autofix.py repo --write

      - uses: peter-evans/create-pull-request@v6
        with:
          path: repo
          commit-message: "claude-api-guard: apply mechanical Claude API fixes"
          title: "claude-api-guard: mechanical Claude API fixes"
          body: >
            Auto-generated by claude-api-guard's weekly autofix job.
            Only covers the 5 rule ids with no judgment call attached
            (see autofix.py's module docstring) — review the diff, but
            these shouldn't need behavior decisions, just a merge.
          branch: claude-api-guard/autofix
          delete-branch: true
