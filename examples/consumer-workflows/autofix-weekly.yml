# TEMPLATE — periodic auto-fix PR for a downstream project.
#
# Same access caveat as check-on-pr.yml's, still worth restating: cloning
# or installing from a second private repo is a DIFFERENT GitHub mechanism
# than the `uses: owner/repo@ref` action reference in check-on-pr.yml (that
# one's covered by Claude-api-goat's repo Settings → Actions → Access, and
# needs nothing extra for a same-account repo like OddsScanner). The `pip
# install` step below is the other case: the default GITHUB_TOKEN a
# workflow gets is scoped ONLY to the repo it's running in — it can't pull
# from a second private repo, same-account or not, without different
# credentials. So this step needs a PAT (fine-grained, "Contents: Read" on
# Claude-api-goat is enough) stored as a secret in the *downstream* repo,
# e.g. `CLAUDE_API_GOAT_RO_TOKEN` — set that up in OddsScanner's own repo
# Settings → Secrets before this workflow will actually run.
#
# What it does: once a week (and on-demand via workflow_dispatch), applies
# the 5 mechanical auto-fixes from autofix.py and opens a PR if anything
# changed. Uses peter-evans/create-pull-request, a well-established action
# for exactly this "generate a patch, open a PR from it" shape — no custom
# PR-opening code needed, and it already no-ops cleanly when there's
# nothing to fix.
#
# Now installs claude-api-guard as a real package instead of checking out
# the tool's whole repo into a subfolder just to reach one file — see
# pyproject.toml and README's "Packaging" section for what that involved
# and its one stated tradeoff (flat top-level module names, not yet a
# claude_api_guard/ namespace).

name: claude-api-guard autofix

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install claude-api-guard from its private repo
        env:
          CLAUDE_API_GOAT_RO_TOKEN: ${{ secrets.CLAUDE_API_GOAT_RO_TOKEN }}
        run: |
          pip install "git+https://x-access-token:${CLAUDE_API_GOAT_RO_TOKEN}@github.com/MarkMoneyMan/Claude-api-goat.git@master"

      - name: Apply mechanical auto-fixes
        run: claude-api-guard-autofix repo --write

      - uses: peter-evans/create-pull-request@v6
        with:
          path: repo
          commit-message: "claude-api-guard: apply mechanical Claude API fixes"
          title: "claude-api-guard: mechanical Claude API fixes"
          body: >
            Auto-generated by claude-api-guard's weekly autofix job.
            Only covers the 5 rule ids with no judgment call attached
            (see autofix.py's module docstring) — review the diff, but
            these shouldn't need behavior decisions, just a merge.
          branch: claude-api-guard/autofix
          delete-branch: true
