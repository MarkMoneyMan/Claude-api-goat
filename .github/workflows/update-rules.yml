# Closes the "self-maintaining" loop: runs sync_rules.py on a schedule (and
# on-demand via workflow_dispatch), which fetches Anthropic's live release
# notes, extracts any new breaking-change rules via the model, and appends
# them to rules.py. Opens a PR only if something actually changed — same
# peter-evans/create-pull-request pattern as autofix-weekly.yml, which
# already no-ops cleanly when there's nothing to do.
#
# Uses a fixed branch name so a run before last week's PR is merged updates
# that PR instead of opening a duplicate.
#
# Needs a repo secret: ANTHROPIC_API_KEY (Settings -> Secrets and
# variables -> Actions). Without it, this job fails loudly rather than
# silently skipping — see sync_rules.py's error message.

name: claude-api-guard rule sync

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC — offset an hour from autofix-weekly's 06:00
  workflow_dispatch:

jobs:
  sync-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Sync rules from Anthropic's release notes
        id: sync
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 sync_rules.py

      - name: Sanity-check rules.py still parses
        run: python3 -c "import ast; ast.parse(open('rules.py').read())"

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "claude-api-guard: sync rules from Anthropic release notes"
          title: "claude-api-guard: new rules from Anthropic's release notes"
          body: >
            Auto-generated by claude-api-guard's weekly rule-sync job. Fetches
            https://platform.claude.com/docs/en/release-notes/overview.md,
            extracts breaking-change rules from whatever's new since the last
            sync, and appends them to rules.py — plus advances
            pipeline_runs/last_synced.json either way, so nothing gets
            re-processed next run. Review each new rule's pattern for false
            positives before merging, same as any hand-written rule.
          branch: claude-api-guard/rule-updates
          delete-branch: true
