# Closes the "self-maintaining" loop: runs sync_rules.py on a schedule (and
# on-demand via workflow_dispatch), once per provider (Anthropic, then
# OpenAI — see PROVIDERS in sync_rules.py), which fetches each provider's
# live changelog, extracts any new breaking-change rules via the model, and
# appends them to that provider's rules file (rules.py / rules_openai.py).
# Opens ONE PR covering whatever actually changed across both — same
# peter-evans/create-pull-request pattern as autofix-weekly.yml, which
# already no-ops cleanly when there's nothing to do. Both providers share
# one PR (rather than one each) because they share one fixed branch and
# one pipeline_runs/last_synced.json — simpler to review as a single
# "what's new this week across every provider we track" diff than to
# manage two competing branches.
#
# Uses a fixed branch name so a run before last week's PR is merged updates
# that PR instead of opening a duplicate.
#
# Needs a repo secret: ANTHROPIC_API_KEY (Settings -> Secrets and
# variables -> Actions) — used to call the model that does the extraction
# for BOTH providers. No OpenAI API key is needed for any of this: syncing
# the OpenAI provider only ever reads OpenAI's public changelog page, it
# never calls OpenAI's own API. Without ANTHROPIC_API_KEY, this job fails
# loudly rather than silently skipping — see sync_rules.py's error message.

name: claude-api-guard rule sync

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC — offset an hour from autofix-weekly's 06:00
  workflow_dispatch:

jobs:
  sync-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Sync rules from Anthropic's release notes
        id: sync-anthropic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 sync_rules.py --provider anthropic

      - name: Sync rules from OpenAI's changelog
        id: sync-openai
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 sync_rules.py --provider openai

      - name: Sanity-check both rules files still parse
        run: |
          python3 -c "import ast; ast.parse(open('rules.py').read())"
          python3 -c "import ast; ast.parse(open('rules_openai.py').read())"

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "claude-api-guard: sync rules from provider release notes"
          title: "claude-api-guard: new rules from provider release notes"
          body: >
            Auto-generated by claude-api-guard's weekly rule-sync job.
            Fetches Anthropic's release notes
            (https://platform.claude.com/docs/en/release-notes/overview.md)
            and openai-python's CHANGELOG.md
            (https://github.com/openai/openai-python/blob/main/CHANGELOG.md,
            pre-filtered to sections explicitly marked "BREAKING CHANGES"),
            extracts breaking-change rules from whatever's new since each
            provider's last sync, and appends them to that provider's rules
            file (rules.py / rules_openai.py) — plus advances
            pipeline_runs/last_synced.json either way, so nothing gets
            re-processed next run. Review each new rule's pattern for false
            positives before merging, same as any hand-written rule — see
            README's "Multi-provider support" section for the kind of
            false positive that's actually shown up in testing so far.
          branch: claude-api-guard/rule-updates
          delete-branch: true
