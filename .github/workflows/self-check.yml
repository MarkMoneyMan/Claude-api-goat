name: self-check

# Dogfoods action.yml against this repo itself, on every push/PR. Three
# jobs, all really assertions about the tool's own correctness (not about
# this repo's code health): one path is known to contain real findings
# and must fail the severity gate, one is known to be clean and must pass
# it, and one installs the pip package (pyproject.toml) fresh and checks
# the installed console scripts behave the same as running the scripts
# directly. If any assumption stops holding, that's a regression to fix,
# not a real finding to triage.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  expect-findings-on-example-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run claude-api-guard against example_project/ (known to have findings)
        id: scan
        uses: ./
        continue-on-error: true
        with:
          path: example_project/
          fail-on: HIGH
      - name: Assert the severity gate actually failed
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::Expected the HIGH-severity gate to fail against example_project/ (it has known HIGH findings), but the step outcome was '${{ steps.scan.outcome }}'."
            exit 1
          fi
          echo "OK: gate correctly failed (${{ steps.scan.outputs.findings-count }} finding(s))."

  expect-clean-on-known-clean-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run claude-api-guard against ci_fixtures/known_clean.py (should be clean)
        id: scan
        uses: ./
        with:
          path: ci_fixtures/known_clean.py
          fail-on: HIGH
      - name: Assert no findings
        run: |
          if [ "${{ steps.scan.outputs.findings-count }}" != "0" ]; then
            echo "::error::Expected 0 findings on ci_fixtures/known_clean.py, got ${{ steps.scan.outputs.findings-count }}. See that file's docstring for why it exists — it must stay free of every rule's trigger strings."
            exit 1
          fi
          echo "OK: 0 findings on the known-clean fixture, as expected."

  package-installs-and-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install claude-api-guard from this checkout (pyproject.toml)
        run: pip install .
      - name: Run the installed claude-api-guard-scan against example_project/
        id: scan
        continue-on-error: true
        run: claude-api-guard-scan example_project/
      - name: Assert it found the known HIGH findings (nonzero exit)
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::Expected the installed claude-api-guard-scan to exit non-zero against example_project/ (it has known findings), but the step outcome was '${{ steps.scan.outcome }}'."
            exit 1
          fi
          echo "OK: installed console script found and reported the known findings."
      - name: Assert the installed claude-api-guard-autofix produces a working patch
        run: |
          cp example_project/autofix_test.py /tmp/autofix_smoke_test.py
          claude-api-guard-autofix /tmp/autofix_smoke_test.py --write
          if diff -q example_project/autofix_test.py /tmp/autofix_smoke_test.py > /dev/null; then
            echo "::error::Expected claude-api-guard-autofix to change /tmp/autofix_smoke_test.py, but it made no edits."
            exit 1
          fi
          python3 -c "import ast; ast.parse(open('/tmp/autofix_smoke_test.py').read())"
          echo "OK: installed autofix console script produced a patch that still parses."
